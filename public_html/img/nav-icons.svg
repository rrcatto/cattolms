    Description:
      The platform navigation icon sprite. Core owns one symbol per semantic navigation icon key,
      and every theme renders the same reference, so a menu item added or renamed in the LMS gets
      an icon in every theme without any theme being touched.

      Themes own presentation only: size, colour and spacing come from the theme's own class on the
      svg element. Every symbol is drawn with stroke="currentColor" and no fill, so it takes the
      colour of the surrounding text whatever the skin.

      A theme may still override a symbol by shipping one with the same id in its own sprite and
      pointing at that instead; the point of this file is that it never has to.

      The fallback symbol is what an unknown key resolves to, so a navigation key added in core can
      never render as a blank space again.

      NavigationIconContractTest asserts that every key ThemeRenderer can emit has a symbol here.
    Changelog:
      2026/08/31 03:50 SAST
      - Created so navigation icons stop being a per-theme responsibility.
  -->
