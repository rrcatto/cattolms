# The API firewall.
#
# Stateless on purpose: an API request carries a Bearer token and nothing else, so there is no
# session to read and no cookie to trust. The web firewall below reads the session the platform
# already keeps rather than managing one of its own, so routes can move across a few at a time.
#
# There is no role hierarchy and no access_control matching on roles. Authorization here is two
# orthogonal questions - does the token carry the transport scope, and does the account hold the
# business permission - and each route states both. Writing either of them as a Symfony ROLE_ would
# create a second vocabulary for rules the platform already has one vocabulary for.
security:
    providers:
        # Never consulted: ApiTokenAuthenticator resolves the identity itself and hands back a
        # SelfValidatingPassport. Symfony requires the key to exist, so it exists and is empty.
        api_tokens:
            memory: ~

        # Never consulted either: SessionAuthenticator resolves the identity from the session and
        # hands back a SelfValidatingPassport.
        web_session:
            memory: ~

    firewalls:
        # The status document is the API's front door and has never required a token: a client
        # reads it to find out that authentication is by Bearer token. Firewalls match in order, so
        # naming it before the API firewall is what keeps it public.
        api_status:
            pattern: ^/api/v1$
            security: false

        api:
            pattern: ^/api/
            stateless: true
            provider: api_tokens
            custom_authenticators:
                - CattoLearning\Api\Security\ApiTokenAuthenticator
            entry_point: CattoLearning\Api\Security\ApiTokenAuthenticator

        # The web firewall. It authenticates every request from the session the platform already
        # keeps and refuses none: an anonymous visitor is not an error on a platform whose catalogue
        # is public. Routes that need an identity say so themselves with #[IsGranted].
        #
        # Not stateless, but not session-managing either: App::run() opens the PostgreSQL-backed
        # session before the kernel sees the request, and AuthService owns it. Symfony reads that
        # identity rather than keeping one of its own, so the web firewall and the API firewall
        # cannot disagree about who is signed in.
        web:
            pattern: ^/
            stateless: true
            provider: web_session
            custom_authenticators:
                - CattoLearning\Auth\Security\SessionAuthenticator
            entry_point: CattoLearning\Auth\Security\SessionAuthenticator
