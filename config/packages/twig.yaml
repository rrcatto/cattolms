twig:
    file_name_pattern: '*.twig'
    # An undefined variable is an error, not a silent blank. Twig's default is to render nothing at
    # all, which is the worst of both: no page breaks, and nothing says the value never arrived.
    strict_variables: true
    paths:
        # Functional page bodies are platform-owned and live in their own namespace, so a theme
        # cannot shadow one. check-runtime-hazards.php fails the build if that isolation is broken.
        '%kernel.project_dir%/resources/views': platform
    # '@theme' is set per request from the active theme: child release first, then its parent.
