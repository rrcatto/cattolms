# DBAL only. The ORM is deliberately absent.
#
# The repositories own their SQL: deferred-join pagination, FILTER clauses, string_agg, correlated
# sub-selects tuned against a benchmark and constraint triggers on 27 tables. An identity map and a
# deferred unit of work would sit between all of that and the database for no gain, and mixing ORM
# writes with raw SQL in one transaction produces stale reads the current mapper model cannot have,
# because F3 mappers write immediately.
#
# DoctrineBundle's recipe ships an `orm:` block with auto_mapping, which fails the container build
# unless doctrine/orm is installed. Its absence here is the whole of turning the ORM off.
doctrine:
    dbal:
        # Off deliberately, and not only to save memory. With kernel.debug on, DoctrineBundle
        # registers BacktraceDebugDataHolder, which retains every executed query *and a backtrace
        # per query* for the lifetime of the request. WebProfilerBundle is not installed, so
        # nothing can ever read any of it. On a bulk write - the Seed Database generator issues
        # tens of thousands of inserts in one request - that is pure cost: it accounted for 9.5 MB
        # of a 70 MB peak at 100,000 rows, and the backtrace capture is paid on every statement.
        profiling: false
        driver: pdo_pgsql
        host: '%env(DB_HOST)%'
        port: '%env(int:DB_PORT)%'
        dbname: '%env(DB_NAME)%'
        user: '%env(DB_USER)%'
        password: '%env(DB_PASSWORD)%'
        server_version: '16'
        charset: utf8
