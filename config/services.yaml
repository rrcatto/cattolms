# The Symfony container.
#
# v0.6 builds its object graph with PHP-DI in ContainerFactory: nine explicit definitions and
# autowiring for everything else. Both containers exist during the migration, and a class is
# registered here only once a Symfony route reaches it - a service registered before anything uses
# it is a service nothing proves.
#
# Note on what may be registered at all. `src/` is not uniformly services:
#
#   Support/                  value objects - Money, Pagination, SortOrder, Slug, Uuid. Private
#                             constructors and static factories. Callers build them; nothing injects
#                             them. Registering the namespace makes the container refuse to compile.
#   Application/, Course/,
#   Auth/, Seed/, View/       services, constructor-injected.
#   Infrastructure/Persistence/  repositories, constructor-injected.
#   Http/Controller/          page controllers; framework-facing classes live in Http/Symfony/.
#
# So registration follows that split rather than pointing at `src/` wholesale.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        # Public because the command-line tools fetch services from this container by class name.
        # They boot the same kernel a request does rather than assembling a second graph, and a
        # private service cannot be fetched. The container is not exposed to anything else.
        public: true
        bind:
            # The three roots, published as parameters by Kernel::build(). Several services take one
            # as a constructor string, and binding by name here keeps the path out of every
            # definition.
            $codeRoot: '%catto.code_root%'
            $instanceRoot: '%catto.instance_root%'
            $publicRoot: '%catto.public_root%'
            $storageRoot: '%catto.instance_root%/storage'
            $bundledImportRoot: '%catto.code_root%/resources/course-imports'

    # The controllers the Symfony kernel routes to. Registered as a namespace rather than one at a
    # time because a controller that is not a service is a 500 with no route name in it, and that
    # is a poor way to find out you forgot a line.
    CattoLearning\Http\Symfony\:
        resource: '../src/Http/Symfony/'
        exclude: '../src/Http/Symfony/{Listener,ApiResponse.php,ApiRequest.php}'
        tags: ['controller.service_arguments']

    CattoLearning\Http\Symfony\Listener\:
        resource: '../src/Http/Symfony/Listener/'

    # The web controllers. Registered as a namespace for the same reason as the Symfony ones: a
    # controller that is not a service is a 500 with no route name in it.
    CattoLearning\Http\Controller\:
        resource: '../src/Http/Controller/'
        exclude: '../src/Http/Controller/BaseController.php'
        tags: ['controller.service_arguments']

    # The application graph a ported route reaches. Registered by namespace: listing services one at
    # a time meant every port added five lines, and forgetting one was a container error at the far
    # end of a request. The excludes are the things in those namespaces that are not services -
    # enums, value objects with private constructors, exceptions - and the connection factory, which
    # the PHP-DI container calls statically.
    CattoLearning\Api\:
        resource: '../src/Api/'
        exclude: '../src/Api/{ApiIdentity.php,ApiScope.php,Security/ApiUser.php,*Exception.php}'

    CattoLearning\Auth\:
        resource: '../src/Auth/'
        exclude: '../src/Auth/{CurrentUser.php,RoleCatalog.php,Security/WebUser.php}'

    CattoLearning\Configuration\:
        resource: '../src/Configuration/'

    # Generated artwork: a course cover, a category icon, a tag icon. Presentation, so it lives
    # beside the theme layer rather than in the persistence graph that calls it.
    CattoLearning\View\Artwork\:
        resource: '../src/View/Artwork/'

    # The Twig theme layer.
    CattoLearning\View\Twig\:
        resource: '../src/View/Twig/'

    # ThemeTemplates takes the filesystem loader itself rather than the Environment, because
    # pointing @theme at the theme a request renders in is a loader operation.
    CattoLearning\View\Twig\ThemeTemplates:
        arguments:
            $loader: '@twig.loader.native_filesystem'

    # One view model for every page, which is what keeps a single set of navigation and
    # breadcrumb rules rather than one per controller.
    CattoLearning\View\ThemeRenderer: ~
    CattoLearning\View\ThemeManager:
        arguments:
            $codeRoot: '%catto.code_root%'
            $instanceRoot: '%catto.instance_root%'
            $publicRoot: '%catto.public_root%'

    CattoLearning\Course\:
        resource: '../src/Course/'
        exclude: '../src/Course/{CatalogueFilter.php,*Exception.php}'

    CattoLearning\Infrastructure\Persistence\:
        resource: '../src/Infrastructure/Persistence/'
        # DatabaseSessionHandler is constructed by App::run() before the container exists - the
        # session has to be open before anything reads an identity - so it is not a service.
        exclude: '../src/Infrastructure/Persistence/{ConnectionFactory.php,PageQuery.php,SessionTimeZoneDriver.php,DatabaseSessionHandler.php}'

    # Repositories depend on Database, not on Doctrine's Connection, because Database infers each
    # bound parameter's PDO type from the PHP value. Same reason as in the PHP-DI container.
    CattoLearning\Infrastructure\Persistence\Database: '@CattoLearning\Infrastructure\Persistence\DbalDatabase'

    # The mail graph. The router's delivery domain is APP_DOMAIN: every domain the platform invents
    # ends in .invalid, so mail to one is rewritten here rather than bouncing off a name that was
    # never meant to resolve.
    CattoLearning\Infrastructure\Mail\:
        resource: '../src/Infrastructure/Mail/'
    CattoLearning\Infrastructure\Mail\GeneratedDomainRouter:
        arguments:
            $deliveryDomain: '%env(APP_DOMAIN)%'
    CattoLearning\Infrastructure\Mail\MailerInterface: '@CattoLearning\Infrastructure\Mail\GeneratedDomainMailer'

    # Data generation, so the Seed Database screen can move across with the rest.
    CattoLearning\Seed\:
        resource: '../src/Seed/'
        # SeedNameFactory is built per run with that run's key, by the generator; SeedGenerationPlan
        # is a value object with a static factory. Neither is a service.
        exclude: '../src/Seed/{SeedGenerationPlan.php,SeedNameFactory.php}'

    # The word lists ship in the release, the installer publishes them to the instance, and the
    # instance copy is the one read - so an operator's edits survive every upgrade.
    CattoLearning\Seed\SeedNamePools:
        arguments:
            $instanceRoot: '%catto.instance_root%/storage/seeds'
            $bundledRoot: '%catto.code_root%/resources/seeds'

    # The application services a ported route reaches.
    CattoLearning\Application\:
        resource: '../src/Application/'
        exclude: '../src/Application/{App.php,CliBootstrap.php,ContainerFactory.php,Kernel.php,RouteRegistrar.php}'

    CattoLearning\Company\:
        resource: '../src/Company/'

    # Support/ is value objects with private constructors and static factories, which is why it is
    # not registered wholesale - doing so makes the container refuse to compile. GeoIpLocator is the
    # exception: it is a service that happens to live among them.
    CattoLearning\Support\GeoIpLocator: ~

    CattoLearning\Event\:
        resource: '../src/Event/'

    CattoLearning\Maintenance\:
        resource: '../src/Maintenance/'

    # LmsMcpTools is constructed per MCP session with that session's identity, by the MCP server
    # entrypoint. It is not a service.
    CattoLearning\Mcp\:
        resource: '../src/Mcp/'
        exclude: '../src/Mcp/{LmsMcpTools.php}'

    # PluginManager takes the container itself - one of the three places allowed to, see
    # check-architecture.php - so it is given the container explicitly rather than autowired.
    CattoLearning\Plugin\:
        resource: '../src/Plugin/'
        exclude: '../src/Plugin/{PluginInterface.php,PluginContext.php,PluginManager.php}'
    CattoLearning\Plugin\PluginManager:
        arguments:
            $container: '@service_container'
            $pluginClasses: []

    # Applied to DoctrineBundle's connection. The platform's own ConnectionFactory registers the
    # same middleware, so both connections agree about the session timezone.
    CattoLearning\Infrastructure\Persistence\SessionTimeZoneMiddleware:
        arguments: ['%env(APP_TIMEZONE)%']
        tags: ['doctrine.middleware']

    CattoLearning\Commerce\Application\:
        resource: '../src/Commerce/Application/'
    CattoLearning\Commerce\Infrastructure\:
        resource: '../src/Commerce/Infrastructure/'
    CattoLearning\Commerce\Policy\:
        resource: '../src/Commerce/Policy/'
    CattoLearning\Commerce\Workflow\:
        resource: '../src/Commerce/Workflow/'
    CattoLearning\Commerce\Contract\PaymentGatewayInterface: '@CattoLearning\Commerce\Infrastructure\Payment\OmnipayPaymentGatewayAdapter'
    CattoLearning\Commerce\Infrastructure\Payment\OmnipayPaymentGatewayAdapter:
        arguments:
            $environment: '%kernel.environment%'

    CattoLearning\Commerce\Http\:
        resource: '../src/Commerce/Http/'
        tags: ['controller.service_arguments']
