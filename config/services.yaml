# The Symfony container.
#
# v0.6 builds its object graph with PHP-DI in ContainerFactory: nine explicit definitions and
# autowiring for everything else. Both containers exist during the migration, and a class is
# registered here only once a Symfony route reaches it - a service registered before anything uses
# it is a service nothing proves.
#
# Note on what may be registered at all. `src/` is not uniformly services:
#
#   Support/                  value objects - Money, Pagination, SortOrder, Slug, Uuid. Private
#                             constructors and static factories. Callers build them; nothing injects
#                             them. Registering the namespace makes the container refuse to compile.
#   Application/, Course/,
#   Auth/, Seed/, View/       services, constructor-injected.
#   Infrastructure/Persistence/  repositories, constructor-injected.
#   Http/Controller/          F3 controllers; the Symfony ones live in Http/Symfony/.
#
# So registration follows that split rather than pointing at `src/` wholesale.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # The three roots, published as parameters by Kernel::build(). Several services take one
            # as a constructor string, and binding by name here keeps the path out of every
            # definition.
            $codeRoot: '%catto.code_root%'
            $instanceRoot: '%catto.instance_root%'
            $publicRoot: '%catto.public_root%'
            $storageRoot: '%catto.instance_root%/storage'
            $bundledImportRoot: '%catto.code_root%/resources/course-imports'

    # The controllers the Symfony kernel routes to. Registered as a namespace rather than one at a
    # time because a controller that is not a service is a 500 with no route name in it, and that
    # is a poor way to find out you forgot a line.
    CattoLearning\Http\Symfony\:
        resource: '../src/Http/Symfony/'
        exclude: '../src/Http/Symfony/{Listener,ApiResponse.php,ApiRequest.php}'
        tags: ['controller.service_arguments']

    CattoLearning\Http\Symfony\Listener\:
        resource: '../src/Http/Symfony/Listener/'

    # The application graph a ported route reaches. Registered by namespace: listing services one at
    # a time meant every port added five lines, and forgetting one was a container error at the far
    # end of a request. The excludes are the things in those namespaces that are not services -
    # enums, value objects with private constructors, exceptions - and the connection factory, which
    # the PHP-DI container calls statically.
    CattoLearning\Api\:
        resource: '../src/Api/'
        exclude: '../src/Api/{ApiIdentity.php,ApiScope.php,Security/ApiUser.php,*Exception.php}'

    CattoLearning\Auth\:
        resource: '../src/Auth/'
        exclude: '../src/Auth/{CurrentUser.php,DataUniverse.php,RoleCatalog.php,RoleFamily.php}'

    CattoLearning\Configuration\:
        resource: '../src/Configuration/'

    # The Twig theme layer.
    CattoLearning\View\Twig\:
        resource: '../src/View/Twig/'

    # ThemeTemplates takes the filesystem loader itself rather than the Environment, because
    # pointing @theme at the theme a request renders in is a loader operation.
    CattoLearning\View\Twig\ThemeTemplates:
        arguments:
            $loader: '@twig.loader.native_filesystem'

    # The view model is shared with the Fat-Free renderer, which is what keeps one set of
    # navigation and breadcrumb rules while both engines are in use.
    CattoLearning\View\ThemeRenderer: ~
    CattoLearning\View\ThemeManager:
        arguments:
            $codeRoot: '%catto.code_root%'
            $instanceRoot: '%catto.instance_root%'
            $publicRoot: '%catto.public_root%'

    CattoLearning\Course\:
        resource: '../src/Course/'
        exclude: '../src/Course/{CatalogueFilter.php,*Exception.php}'

    CattoLearning\Infrastructure\Persistence\:
        resource: '../src/Infrastructure/Persistence/'
        exclude: '../src/Infrastructure/Persistence/{ConnectionFactory.php,PageQuery.php,SeedTableCatalog.php,SessionTimeZoneDriver.php}'

    # Repositories depend on Database, not on Doctrine's Connection, because Database infers each
    # bound parameter's PDO type from the PHP value. Same reason as in the PHP-DI container.
    CattoLearning\Infrastructure\Persistence\Database: '@CattoLearning\Infrastructure\Persistence\DbalDatabase'

    # Applied to DoctrineBundle's connection. The platform's own ConnectionFactory registers the
    # same middleware, so both connections agree about the session timezone.
    CattoLearning\Infrastructure\Persistence\SessionTimeZoneMiddleware:
        arguments: ['%env(APP_TIMEZONE)%']
        tags: ['doctrine.middleware']
