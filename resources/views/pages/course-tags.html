<set ph_back_href="/courses" ph_back_label="Course catalogue" ph_kicker="Browse" ph_title="Browse by tag" ph_lead="Every label in the catalogue. The larger a tag, the more courses carry it." />
<include href="partials/page-head.html" />

<section class="container-fluid cl-container-wide py-5">
  <check if="{{ @tag_index }}">
    <true>
      <div class="cl-tag-cloud">
        <repeat group="{{ @tag_index }}" value="{{ @cloud_tag }}">
          <a class="cl-tag-chip cl-tag-weight-{{ @cloud_tag.weight }}" href="/courses/tag/{{ @cloud_tag.slug }}"
             title="{{ @cloud_tag.name }}">
            <span>{{ @cloud_tag.name }}</span>
            <span class="cl-category-count">{{ @cloud_tag.course_count }}</span>
          </a>
        </repeat>
      </div>
    </true>
    <false><div class="empty section"><h3>No tags have been created yet</h3></div></false>
  </check>
</section>
