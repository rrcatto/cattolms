<div class="section-head"><div><h2>Course requests</h2><p>Approval uses an exact matching credit where available.</p></div></div><check if="{{ @requests }}"><true><div class="list"><repeat group="{{ @requests }}" value="{{ @request }}"><div class="list-item"><div><strong>{{ @request.learner_name }} requested {{ @request.course_title }}</strong><p>{{ @request.status }} · {{ @request.requested_at }}</p></div><check if="{{ @request.status=='pending' }}"><form action="/company/requests/{{ @request.id }}/decision" method="post" class="row-actions"><input type="hidden" name="csrf" value="{{ @csrf }}"><button class="btn btn-primary btn-sm" name="decision" value="approve">Approve</button><button class="btn btn-danger btn-sm" name="decision" value="reject">Reject</button></form></check></div></repeat></div></true><false><div class="empty">There are no course requests.</div></false></check>
<check if="{{ @requests_pagination }}">
  <true>
    <include href="partials/pagination.html" with="pg=@requests_pagination" />
  </true>
  <false>
    <check if="{{ @requests_preview_has_more }}">
      <div class="pagination-row">
        <span class="pagination-summary">Showing the first {{ @preview_page_size }} requests.</span>
        <a class="btn btn-soft btn-sm" href="/company/requests">View all requests</a>
      </div>
    </check>
  </false>
</check>
