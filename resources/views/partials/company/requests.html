  Company Course Requests section body.

  Lists the course requests belonging to the company currently in context, with the shared live
  search and the shared pagination control. Approving a request consumes an exact matching
  available credit before any purchase, which is why the decision is a POST the server validates
  rather than anything decided in this markup.

  Only a pending request offers Approve and Reject; a decided one shows its outcome and nothing
  more.

  WARNING: a template comment is not a safe place to document syntax. F3 parses its own tags
  inside comments, so a tag written out as a usage example becomes a real tag in the compiled

<include href="partials/dataset-search.html" with="ds_name='requests',ds_label='Search requests',ds_value=@requests_search,ds_action='/company/requests'" />

<div id="requests-region">
<div id="requests-results">

	<div class="section-head">
		<div>
			<h2>Course requests</h2>
			<p>Approval uses an exact matching credit where available.</p>
		</div>
	</div>

	<check if="{{ @requests }}">
		<true>
			<div class="list">
				<repeat group="{{ @requests }}" value="{{ @request }}">
					<div class="list-item">
						<div>
							<strong>{{ @request.learner_name }} requested {{ @request.course_title }}</strong>
							<p>{{ @request.status }} · {{ @request.requested_at }}</p>
						</div>
						<check if="{{ @request.status=='pending' }}">
							<form action="/company/requests/{{ @request.id }}/decision" method="post" class="row-actions">
								<input type="hidden" name="csrf" value="{{ @csrf }}">
								<button class="btn btn-primary btn-sm" name="decision" value="approve">Approve</button>
								<button class="btn btn-danger btn-sm" name="decision" value="reject">Reject</button>
							</form>
						</check>
					</div>
				</repeat>
			</div>
		</true>
		<false>
			<div class="empty">There are no course requests.</div>
		</false>
	</check>

	<check if="{{ @requests_pagination }}">
		<true>
			<include href="partials/pagination.html" with="pg=@requests_pagination" />
		</true>
		<false>
			<check if="{{ @requests_preview_has_more }}">
				<div class="pagination-row">
					<span class="pagination-summary">Showing the first {{ @preview_page_size }} requests.</span>
					<a class="btn btn-soft btn-sm" href="/company/requests">View all requests</a>
				</div>
			</check>
		</false>
	</check>

</div>
</div>
