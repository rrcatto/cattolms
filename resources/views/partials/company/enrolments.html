<include href="partials/dataset-search.html" with="ds_name='enrolments',ds_label='Search enrolments',ds_value=@enrolments_search,ds_action='/company/enrolments'" />

<div id="enrolments-region">
<div id="enrolments-results">

	<div class="section-head">
		<div>
			<h2>Company enrolments</h2>
			<p>Company learner enrolments and progress.</p>
		</div>
	</div>

	<div class="table-wrap">
		<table>
			<thead>
				<tr><th>Learner</th><th>Course</th><th>Status</th><th>Progress</th><th></th></tr>
			</thead>
			<tbody>
				<repeat group="{{ @enrolments }}" value="{{ @enrolment }}">
					<tr>
						<td>{{ @enrolment.learner_name }}</td>
						<td>{{ @enrolment.course_title }}</td>
						<td>{{ @enrolment.status }}</td>
						<td>{{ @enrolment.progress_percentage }}%</td>
						<td>
							<check if="{{ @enrolment.status=='cancelled' }}">
								<true>
									<form action="/company/enrolments/{{ @enrolment.id }}/restore" method="post">
										<input type="hidden" name="csrf" value="{{ @csrf }}">
										<button class="btn btn-soft btn-sm">Restore</button>
									</form>
								</true>
								<false>
									<form action="/company/enrolments/{{ @enrolment.id }}/remove" method="post">
										<input type="hidden" name="csrf" value="{{ @csrf }}">
										<button class="btn btn-danger btn-sm">Remove access</button>
									</form>
								</false>
							</check>
						</td>
					</tr>
				</repeat>
			</tbody>
		</table>
	</div>

	<check if="{{ @enrolments_pagination }}">
		<true>
			<include href="partials/pagination.html" with="pg=@enrolments_pagination" />
		</true>
		<false>
			<check if="{{ @enrolments_preview_has_more }}">
				<div class="pagination-row">
					<span class="pagination-summary">Showing the first {{ @preview_page_size }} enrolments.</span>
					<a class="btn btn-soft btn-sm" href="/company/enrolments">View all enrolments</a>
				</div>
			</check>
		</false>
	</check>

</div>
</div>
