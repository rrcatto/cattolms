  The Switch Company result region: one page of companies a platform administrator may choose to
  administer.

  Rendered inline inside the Switch Company modal on first paint and swapped into that same region

  first page is server-rendered, the picker still works with no JavaScript at all: the search form
  is an ordinary GET and each pagination link is an ordinary link.

  Selecting is a POST carrying a CSRF token, never a link. Which company is being administered is
  an authorisation boundary rather than a display preference, so it can only be changed by a form
  submission the server can verify.

  The universe badge is shown because a platform administrator choosing between a real company and
  a generated one must be able to see which is which before choosing, not afterwards. The company
  chosen is what sets the workspace universe.

<div id="picker-results">

	<check if="{{ @picker_companies }}">
		<true>
			<div class="table-wrap">
				<table>
					<thead>
						<tr><th>Company</th><th>Domain</th><th>Data</th><th>Status</th><th></th></tr>
					</thead>
					<tbody>
						<repeat group="{{ @picker_companies }}" value="{{ @company }}">
							<tr>
								<td>
									<strong>{{ @company.name }}</strong>
									<check if="{{ @company.is_system }}"><div><span class="badge permanent">System Company</span></div></check>
								</td>
								<td class="mono small">{{ @company.domain }}</td>
								<td><span class="badge {{ @company.is_seed ? 'warn' : 'info' }}">{{ @company.universe_label }}</span></td>
								<td><span class="badge {{ @company.status=='active' ? 'good' : 'danger' }}">{{ @company.status_label }}</span></td>
								<td>
									<check if="{{ @company.id == @company_context_id }}">
										<true><span class="badge good">Administering</span></true>
										<false>
											<check if="{{ @company.status=='active' }}">
												<true>
													<form action="/company/context" method="post">
														<input type="hidden" name="csrf" value="{{ @csrf }}">
														<input type="hidden" name="company_id" value="{{ @company.id }}">
														<button class="btn btn-primary btn-sm" type="submit">Manage</button>
													</form>
												</true>
												<false><span class="muted small">Disabled</span></false>
											</check>
										</false>
									</check>
								</td>
							</tr>
						</repeat>
					</tbody>
				</table>
			</div>

			<check if="{{ @picker_pagination }}">
				<include href="partials/pagination.html" with="pg=@picker_pagination" />
			</check>
		</true>
		<false>
			<p class="empty">No companies match “{{ @picker_search }}”.</p>
		</false>
	</check>

</div>
