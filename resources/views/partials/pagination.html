<div class="pagination-row" role="navigation" aria-label="{{ @pg.label }} pagination">

  <div class="pagination-summary" aria-live="polite">
    <span>Showing {{ @pg.from }}-{{ @pg.to }} of {{ @pg.total }}</span>
    <span class="pagination-pages">Page {{ @pg.page }} of {{ @pg.total_pages }}</span>
  </div>

  <div class="pagination-controls">
    <check if="{{ @pg.has_previous }}">
      <true>
        <a class="btn btn-soft btn-sm" rel="prev"
           href="{{ @pg.base }}?{{ @pg.query }}{{ @pg.page_param }}={{ @pg.previous_page }}&amp;{{ @pg.size_param }}={{ @pg.page_size }}">Previous</a>
      </true>
      <false>
        <span class="btn btn-soft btn-sm is-disabled" aria-disabled="true">Previous</span>
      </false>
    </check>

    <check if="{{ @pg.has_next }}">
      <true>
        <a class="btn btn-soft btn-sm" rel="next"
           href="{{ @pg.base }}?{{ @pg.query }}{{ @pg.page_param }}={{ @pg.next_page }}&amp;{{ @pg.size_param }}={{ @pg.page_size }}">Next</a>
      </true>
      <false>
        <span class="btn btn-soft btn-sm is-disabled" aria-disabled="true">Next</span>
      </false>
    </check>
  </div>

  <form class="pagination-page-size" method="get" action="{{ @pg.base }}">
    <!-- Changing the page size returns to page 1: remaining on page 9 of 25 is meaningless
         once the page size changes, and clamping would land the reader somewhere arbitrary. -->
    <input type="hidden" name="{{ @pg.page_param }}" value="1">
    <repeat group="{{ @pg.filters }}" key="{{ @filter_key }}" value="{{ @filter_value }}">
      <input type="hidden" name="{{ @filter_key }}" value="{{ @filter_value }}">
    </repeat>
    <label for="{{ @pg.prefix }}-page-size">Rows per page</label>
    <select id="{{ @pg.prefix }}-page-size" name="{{ @pg.size_param }}" onchange="this.form.submit()">
      <repeat group="{{ @pg.page_sizes }}" value="{{ @size }}">
        <option value="{{ @size }}" {{ @pg.page_size == @size ? 'selected' : '' }}>{{ @size }}</option>
      </repeat>
    </select>
    <noscript><button class="btn btn-soft btn-sm" type="submit">Apply</button></noscript>
  </form>

</div>
