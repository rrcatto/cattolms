Description:
  Pagination 2.0. The one functional pagination control for every paginated list in the LMS.

  Core owns this markup. Themes style it through the pagination classes and the ordinary
  platform button classes; a theme never recreates or replaces it, and no screen may grow a
  control of its own beside it.

  Included with one array so several independent controls can appear on one route without
  sharing state. Callers include this file passing a single dataset array as the pg parameter.

  What the control offers, and why each part is here:

  First and Last exist because a dataset of four thousand pages is otherwise only reachable one
  page at a time. Previous and Next stay because they are what most readers actually use, and
  they keep their prev and next link relationships so a browser and a crawler can follow them.

  The numbered pages are the adaptive window Pagination builds: the first page, the last page,
  the current page and two either side, with an ellipsis standing in for whatever was elided.
  The window is shifted rather than clipped near either end, so the control is always the same
  width and a link does not move out from under the cursor as the reader pages inwards.

  Jump to page is a plain number input rather than a select. A select over four thousand pages
  is the same whole-table control this platform removed everywhere else, and a reader who knows
  they want page 1900 should be able to say so in one action. An out of range number lands on
  the nearest real page rather than on an error, because the reader is guessing by design.

  Rows per page returns to the first page. Staying on page nine of twenty-five is meaningless
  once the page size changes, and clamping would land the reader somewhere arbitrary.

  A list that fits on one page renders its summary and nothing else. Every control here would point
  at the page the reader is already on, and a row of dead buttons is worse than no row at all. The
  row count stays, because how many records exist is still worth knowing.

  The control is rendered above and below every table. A reader who has just scrolled a hundred and
  fifty rows should not have to scroll back to change page, and a reader who has just arrived should
  not have to scroll down to find out there are more.

  Every target URL is composed by PlatformAdministrationService, not here. The control used to
  concatenate a route, a query string, a page parameter and a size parameter inline, so each
  link re-derived the same URL and a new link had to re-derive it again. The search term, the
  data universe, every list filter and the chosen page size are ordinary query values to that
  builder, which is why paging preserves all of them without this file knowing what any of them
  are.

  htmx is progressive enhancement here exactly as it is on the shared search. Every link is a
  real link and every form is a real GET form, so the whole control works with no JavaScript at
  all. Where htmx is available the request swaps only the results region, and the URL is pushed
  so that reloading, sharing or going back lands on the page the reader was actually looking at.
  The swap targets an outer region that is never itself replaced and replaces only the results
  element inside it, so one malformed response costs a single interaction rather than removing
  the element that carries the target and killing the control until a reload.

  WARNING: a template comment is not a safe place to document syntax. F3 parses its own tags
  inside comments, so a tag written out as a usage example becomes a real tag in the compiled
  template; in this file that produced an infinite self-include and exhausted memory. A comment
  delimiter written inside a comment body ends it early and leaks the remainder onto the page.
  Keep every comment plain prose: no angle brackets, no comment delimiters, no template tokens
  and no code, not even to document one.

<nav class="pagination-row" role="navigation" aria-label="{{ @pg.label }} pagination" data-pagination="{{ @pg.prefix }}">

	<div class="pagination-summary" aria-live="polite">
		<span>Showing {{ @pg.from }}-{{ @pg.to }} of {{ @pg.total }}</span>
		<span class="pagination-pages">Page {{ @pg.page }} of {{ @pg.total_pages }}</span>
	</div>

	<check if="{{ @pg.has_pages }}">

	<div class="pagination-controls">

		<check if="{{ @pg.has_previous }}">
			<true>
				<a class="btn btn-soft btn-sm pagination-edge" href="{{ @pg.first_href }}" aria-label="First page"
				   hx-get="{{ @pg.first_href }}" hx-target="#{{ @pg.region }}" hx-select="#{{ @pg.results }}"
				   hx-swap="innerHTML" hx-push-url="true" hx-indicator="closest .pagination-row">&laquo; First</a>
				<a class="btn btn-soft btn-sm" rel="prev" href="{{ @pg.previous_href }}" aria-label="Previous page"
				   hx-get="{{ @pg.previous_href }}" hx-target="#{{ @pg.region }}" hx-select="#{{ @pg.results }}"
				   hx-swap="innerHTML" hx-push-url="true" hx-indicator="closest .pagination-row">Previous</a>
			</true>
			<false>
				<span class="btn btn-soft btn-sm pagination-edge is-disabled" aria-disabled="true">&laquo; First</span>
				<span class="btn btn-soft btn-sm is-disabled" aria-disabled="true">Previous</span>
			</false>
		</check>

		<ol class="pagination-pages-list">
			<repeat group="{{ @pg.pages }}" value="{{ @pg_item }}">
				<li>
					<check if="{{ @pg_item.is_gap }}">
						<true>
							<span class="pagination-gap" aria-hidden="true">&hellip;</span>
						</true>
						<false>
							<check if="{{ @pg_item.is_current }}">
								<true>
									<span class="btn btn-primary btn-sm pagination-page is-current" aria-current="page">{{ @pg_item.page }}</span>
								</true>
								<false>
									<a class="btn btn-soft btn-sm pagination-page" href="{{ @pg_item.href }}"
									   aria-label="Page {{ @pg_item.page }}"
									   hx-get="{{ @pg_item.href }}" hx-target="#{{ @pg.region }}" hx-select="#{{ @pg.results }}"
									   hx-swap="innerHTML" hx-push-url="true" hx-indicator="closest .pagination-row">{{ @pg_item.page }}</a>
								</false>
							</check>
						</false>
					</check>
				</li>
			</repeat>
		</ol>

		<check if="{{ @pg.has_next }}">
			<true>
				<a class="btn btn-soft btn-sm" rel="next" href="{{ @pg.next_href }}" aria-label="Next page"
				   hx-get="{{ @pg.next_href }}" hx-target="#{{ @pg.region }}" hx-select="#{{ @pg.results }}"
				   hx-swap="innerHTML" hx-push-url="true" hx-indicator="closest .pagination-row">Next</a>
				<a class="btn btn-soft btn-sm pagination-edge" href="{{ @pg.last_href }}" aria-label="Last page"
				   hx-get="{{ @pg.last_href }}" hx-target="#{{ @pg.region }}" hx-select="#{{ @pg.results }}"
				   hx-swap="innerHTML" hx-push-url="true" hx-indicator="closest .pagination-row">Last &raquo;</a>
			</true>
			<false>
				<span class="btn btn-soft btn-sm is-disabled" aria-disabled="true">Next</span>
				<span class="btn btn-soft btn-sm pagination-edge is-disabled" aria-disabled="true">Last &raquo;</span>
			</false>
		</check>

	</div>

	<form class="pagination-jump" method="get" action="{{ @pg.base }}"
	      hx-get="{{ @pg.base }}" hx-target="#{{ @pg.region }}" hx-select="#{{ @pg.results }}"
	      hx-swap="innerHTML" hx-push-url="true" hx-indicator="closest .pagination-row">
		<repeat group="{{ @pg.filters }}" key="{{ @filter_key }}" value="{{ @filter_value }}">
			<input type="hidden" name="{{ @filter_key }}" value="{{ @filter_value }}">
		</repeat>
		<input type="hidden" name="{{ @pg.size_param }}" value="{{ @pg.page_size }}">
		<label for="{{ @pg.prefix }}-jump-page">Jump to page</label>
		<input id="{{ @pg.prefix }}-jump-page" name="{{ @pg.page_param }}" type="number" inputmode="numeric"
		       min="1" max="{{ @pg.total_pages }}" step="1" value="{{ @pg.page }}"
		       aria-describedby="{{ @pg.prefix }}-jump-help">
		<button class="btn btn-soft btn-sm" type="submit">Go</button>
		<span class="help" id="{{ @pg.prefix }}-jump-help">of {{ @pg.total_pages }}</span>
	</form>

	<form class="pagination-page-size" method="get" action="{{ @pg.base }}"
	      hx-get="{{ @pg.base }}" hx-target="#{{ @pg.region }}" hx-select="#{{ @pg.results }}"
	      hx-swap="innerHTML" hx-push-url="true" hx-indicator="closest .pagination-row">
		<input type="hidden" name="{{ @pg.page_param }}" value="1">
		<repeat group="{{ @pg.filters }}" key="{{ @filter_key }}" value="{{ @filter_value }}">
			<input type="hidden" name="{{ @filter_key }}" value="{{ @filter_value }}">
		</repeat>
		<label for="{{ @pg.prefix }}-page-size">Rows per page</label>
		<select id="{{ @pg.prefix }}-page-size" name="{{ @pg.size_param }}" onchange="this.form.requestSubmit ? this.form.requestSubmit() : this.form.submit()">
			<repeat group="{{ @pg.page_sizes }}" value="{{ @size }}">
				<option value="{{ @size }}" {{ @pg.page_size == @size ? 'selected' : '' }}>{{ @size }}</option>
			</repeat>
		</select>
		<noscript><button class="btn btn-soft btn-sm" type="submit">Apply</button></noscript>
	</form>

	</check>

</nav>
