<div class="universe-switch" data-universe="{{ @us.selected }}">

  <check if="{{ @ct }}">
    <p class="universe-switch-summary">
      <span class="universe-switch-noun">{{ @ct.label }}</span>
      <strong>{{ @ct.total_display }}</strong> total
      <span class="universe-switch-split">{{ @ct.real_display }} real · {{ @ct.seed_display }} seed</span>
    </p>
  </check>

  <div class="universe-switch-links" role="group" aria-label="Show which data">
    <span class="universe-switch-legend" aria-hidden="true">View</span>
    <repeat group="{{ @us.options }}" value="{{ @universe_option }}">
      <a class="universe-switch-link {{ @universe_option.active ? 'active' : '' }}"
         href="{{ @universe_option.href }}"
         aria-current="{{ @universe_option.active ? 'true' : 'false' }}">{{ @universe_option.short_label }}</a>
    </repeat>
  </div>

</div>
