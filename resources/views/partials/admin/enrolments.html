<include href="partials/admin/course-group-nav.html" />

<div class="section-head">
	<div>
		<h2>Enrolments</h2>
		<p>Learner access to courses, and how far each has got.</p>
	</div>
</div>



	<check if="{{ @universe_switch }}">
		<include href="partials/universe-switch.html" with="us=@universe_switch,ct=@enrolments_universe_counts" />
	</check>

	<include href="partials/dataset-search.html" with="ds_name='enrolments',ds_label='Search enrolments',ds_value=@enrolments_search,ds_action='/admin/course/enrolments'" />

	<div id="enrolments-region" data-server-search-target>
	<div id="enrolments-results">

	<check if="{{ @enrolments_pagination }}">
		<include href="partials/pagination.html" with="pg=@enrolments_pagination" />
	</check>

		<div class="table-wrap">
			<table>
				<thead>
					<tr><repeat group="{{ @enrolments_sort_headers }}" value="{{ @sh }}"><include href="partials/sortable-header.html" with="sh=@sh,sort_region=@enrolments_region,sort_results=@enrolments_results" /></repeat></tr>
				</thead>
				<tbody>
					<repeat group="{{ @enrolments }}" value="{{ @enrolment }}">
						<tr>
							<td title="{{ @enrolment.learner_name }} · {{ @enrolment.email }}">
								{{ @enrolment.learner_name }}
								
							</td>
							<td title="{{ @enrolment.course_title }}">{{ @enrolment.course_title }}</td>
							<td><span class="badge {{ @enrolment.status=='cancelled' ? 'danger' : 'info' }}">{{ @enrolment.status }}</span></td>
							<td>{{ @enrolment.progress_percentage }}%</td>
							<td class="cell-actions">
								<div class="row-actions">
									<check if="{{ @enrolment.status=='cancelled' }}">
										<true>
											<form action="/admin/course/enrolments/{{ @enrolment.id }}/restore" method="post">
												<input type="hidden" name="csrf" value="{{ @csrf }}">
												<button class="btn btn-soft btn-sm" title="Restore this learner's course access">Restore</button>
											</form>
										</true>
										<false>
											<form action="/admin/course/enrolments/{{ @enrolment.id }}/remove" method="post">
												<input type="hidden" name="csrf" value="{{ @csrf }}">
												<input type="hidden" name="reason" value="Removed by platform administrator">
												<button class="btn btn-danger btn-sm" title="Remove this learner's course access" data-confirm="Remove this learner’s course access?">Remove</button>
											</form>
										</false>
									</check>
								</div>
							</td>
						</tr>
					</repeat>
				</tbody>
			</table>
		</div>

		<check if="{{ @enrolments_pagination }}">
			<true>
				<include href="partials/pagination.html" with="pg=@enrolments_pagination" />
			</true>
			<false>
				<check if="{{ @enrolments_preview_has_more }}">
					<div class="pagination-row">
						<span class="pagination-summary">Showing the first {{ @preview_page_size }} enrolments.</span>
						<a class="btn btn-soft btn-sm" href="/admin/enrolments{{ @universe_query }}">View all enrolments</a>
					</div>
				</check>
			</false>
		</check>
