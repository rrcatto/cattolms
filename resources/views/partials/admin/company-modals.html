<check if="{{ @can_manage_companies }}">
	<div class="modal-backdrop" id="company-add" role="dialog" aria-modal="true" aria-labelledby="company-add-title" aria-hidden="true" hidden>
		<div class="modal-card">
			<form action="/admin/companies" method="post">
				<input type="hidden" name="csrf" value="{{ @csrf }}">
				<div class="modal-head"><h3 id="company-add-title">Add Company</h3><button class="close-btn" type="button" data-close-modal aria-label="Close">×</button></div>
				<div class="modal-body"><div class="form-grid">
					<div class="field full"><label>Company name</label><input name="name" required></div>
					<div class="field full"><label>Registered email domain</label><input name="domain" placeholder="example.co.za" required></div>
					<div class="field full"><label>Company type</label><select name="company_type"><option value="client">Client company</option><option value="course_provider">Course provider</option></select></div>
				</div></div>
				<div class="modal-foot"><button class="btn btn-soft" type="button" data-close-modal>Cancel</button><button class="btn btn-primary" type="submit">Create Company</button></div>
			</form>
		</div>
	</div>

	<repeat group="{{ @cm_rows }}" value="{{ @company }}">
		<div class="modal-backdrop" id="company-edit-{{ @company.id }}" role="dialog" aria-modal="true" aria-labelledby="company-edit-title-{{ @company.id }}" aria-hidden="true" hidden>
			<div class="modal-card">
				<form action="/admin/companies/{{ @company.id }}" method="post">
					<input type="hidden" name="csrf" value="{{ @csrf }}">
					<div class="modal-head">
						<h3 id="company-edit-title-{{ @company.id }}">Edit {{ @company.name }}</h3>
						<button class="close-btn" type="button" data-close-modal aria-label="Close">×</button>
					</div>
					<div class="modal-body">
						<div class="form-grid">
							<div class="field full"><label>Company name</label><input name="name" value="{{ @company.name }}" required></div>
							<div class="field full"><label>Domain</label><input name="domain" value="{{ @company.domain }}" required></div>
							<div class="field full">
								<label>Company type</label><select name="company_type" {{ @company.is_system ? 'disabled' : '' }}>
									<option value="client" {{ @company.company_type=='client' ? 'selected' : '' }}>Client company</option>
									<option value="course_provider" {{ @company.company_type=='course_provider' ? 'selected' : '' }}>Course provider</option>
									<option value="system" {{ @company.company_type=='system' ? 'selected' : '' }}>System Company</option>
								</select>
								<check if="{{ @company.is_system }}"><input type="hidden" name="company_type" value="system"></check>
							</div>
						</div>
					</div>
					<div class="modal-foot">
						<button class="btn btn-soft" type="button" data-close-modal>Cancel</button>
						<button class="btn btn-primary" type="submit">Save company</button>
					</div>
				</form>
				<check if="{{ !@company.is_system }}">
					<form action="/admin/companies/{{ @company.id }}/status" method="post" class="modal-foot">
						<input type="hidden" name="csrf" value="{{ @csrf }}">
						<input type="hidden" name="status" value="{{ @company.status=='active' ? 'disabled' : 'active' }}">
						<button class="btn {{ @company.status=='active' ? 'btn-danger' : 'btn-soft' }} btn-sm">{{ @company.status=='active' ? 'Disable company' : 'Enable company' }}</button>
					</form>
				</check>
			</div>
		</div>
	</repeat>
</check>
