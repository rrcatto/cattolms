<include href="partials/admin/company-group-nav.html" />

<div class="notice"><span>ⓘ</span><div><strong>System Company:</strong> the permanent host organisation. It cannot be disabled or deleted.</div></div>

<include href="partials/dataset-search.html" with="ds_name='companies',ds_label='Search course consumers',ds_value=@companies_search,ds_action='/admin/companies'" />
<check if="{{ @universe_switch }}">
	<include href="partials/universe-switch.html" with="us=@universe_switch,ct=@companies_universe_counts" />
</check>

<div class="toolbar">
	<div></div>
	<check if="{{ @can_manage_companies }}"><button class="btn btn-primary" type="button" data-open-modal="company-add">＋ Add Company</button></check>
</div>

<include href="partials/admin/company-modals.html" with="cm_rows=@companies" />

<div id="companies-region" data-server-search-target>
<div id="companies-results">

	<check if="{{ @companies_pagination }}">
		<include href="partials/pagination.html" with="pg=@companies_pagination" />
	</check>

	<div class="table-wrap section">
		<table>
			<thead>
				<tr><repeat group="{{ @companies_sort_headers }}" value="{{ @sh }}"><include href="partials/sortable-header.html" with="sh=@sh,sort_region=@companies_region,sort_results=@companies_results" /></repeat></tr>
			</thead>
			<tbody>
				<repeat group="{{ @companies }}" value="{{ @company }}">
					<tr>
						<td title="{{ @company.name }} · {{ @company.domain }}">
							<strong>{{ @company.name }}</strong>
							<check if="{{ @company.is_system }}"><span class="badge permanent">System</span></check>
						</td>
						<td>{{ @company.people_count }}</td>
						<td>{{ @company.enrolment_count }}</td>
						<td><span class="badge {{ @company.status=='active' ? 'good' : 'danger' }}">{{ @company.status_label }}</span></td>
						<td class="cell-actions">
							<details class="row-menu" data-cl-dropdown>
								<summary class="btn btn-soft btn-sm row-menu-trigger">Actions ▾</summary>
								<div class="row-menu-panel">
									<check if="{{ @can_select_company && @company.status=='active' }}">
										<form action="/company/context" method="post">
											<input type="hidden" name="csrf" value="{{ @csrf }}">
											<input type="hidden" name="company_id" value="{{ @company.id }}">
											<button class="btn btn-primary btn-sm" type="submit">Manage</button>
										</form>
									</check>
									<check if="{{ @can_manage_companies }}"><button class="btn btn-soft btn-sm" type="button" data-open-modal="company-edit-{{ @company.id }}">Edit</button></check>
								</div>
							</details>
						</td>
					</tr>
				</repeat>
			</tbody>
		</table>
	</div>

	<check if="{{ @companies_pagination }}">
		<true>
			<include href="partials/pagination.html" with="pg=@companies_pagination" />
		</true>
		<false>
			<check if="{{ @companies_preview_has_more }}">
				<div class="pagination-row">
					<span class="pagination-summary">Showing the first {{ @preview_page_size }} companies.</span>
					<a class="btn btn-soft btn-sm" href="/admin/companies{{ @universe_query }}">View all course consumers</a>
				</div>
			</check>
		</false>
	</check>

</div>
</div>
