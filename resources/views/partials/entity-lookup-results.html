Version: 0.5.7.6
Description:
  Result fragment returned by the admin lookup route and swapped into place by htmx.

  Each result is a button that writes the chosen id into the hidden field named by the lookup
  target and shows the chosen label, so the surrounding form still submits a plain integer id
  over POST with CSRF exactly as it did when this was a dropdown.

  Rendered without theme chrome: it is core functional markup styled by platform classes.

Changelog:
  2026/08/21 11:04 SAST
  - Rewrote this header in plain prose. Comments must never carry angle brackets, comment delimiters, template tokens or code, because each of those is read as markup rather than as text.
  2026/08/20 20:02 SAST
  - Created for the v0.5.7.6 pagination and large-data UI foundations release.
-->
<check if="{{ !@lookup_searched }}">
  <true>
    <p class="help lookup-hint">Type at least {{ @lookup_min_length }} characters to search.</p>
  </true>
  <false>
    <check if="{{ @lookup_results }}">
      <true>
        <ul class="lookup-results" role="listbox" aria-label="Search results">
          <repeat group="{{ @lookup_results }}" value="{{ @result }}">
            <li role="option">
              <button type="button"
                      class="lookup-result"
                      data-lookup-target="{{ @lookup_target }}"
                      data-lookup-id="{{ @result.id }}"
                      data-lookup-label="{{ @result.label }}">
                <span class="lookup-result-label">{{ @result.label }}</span>
                <span class="lookup-result-detail">{{ @result.detail }}</span>
              </button>
            </li>
          </repeat>
        </ul>
        <!-- The cap is stated rather than hidden: a silently truncated result list is the
             same defect this release removes from the data tables. -->
        <check if="{{ count(@lookup_results) >= @lookup_max_results }}">
          <p class="help lookup-hint">Showing the first {{ @lookup_max_results }} matches. Refine your search to narrow them.</p>
        </check>
      </true>
      <false>
        <p class="help lookup-hint">No matches for “{{ @lookup_query }}”.</p>
      </false>
    </check>
  </false>
</check>
