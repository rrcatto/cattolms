<aside class="sidebar" id="sidebar" data-theme-nav>
  <a class="brand" href="/" aria-label="Home"><div class="brand-mark">CL</div><div><strong>{{ @app_name }}</strong><span>Learning platform</span></div></a>
  <div class="side-label">Workspace</div>
  <nav class="side-nav" aria-label="Primary navigation">
    <repeat group="{{ @navigation }}" value="{{ @nav }}">
      <check if="{{ count(@nav.children) > 0 }}">
        <details class="account-menu" data-cl-dropdown {{ @nav.active ? 'open' : '' }}>
          <summary class="nav-link {{ @nav.active ? 'active' : '' }}" data-nav-item="{{ @nav.key }}"><span class="nav-icon">{{ @nav.icon }}</span>{{ @nav.label }}</summary>
          <div class="account-menu-panel">
            <repeat group="{{ @nav.children }}" value="{{ @child }}"><a class="nav-link" href="{{ @child.href }}" data-nav-item="{{ @child.key }}"><span class="nav-icon">{{ @child.icon }}</span>{{ @child.label }}</a></repeat>
          </div>
        </details>
      </check>
      <check if="{{ count(@nav.children) == 0 && @nav.method != 'POST' }}"><a class="nav-link {{ @nav.active ? 'active' : '' }}" href="{{ @nav.href }}" data-nav-item="{{ @nav.key }}"><span class="nav-icon">{{ @nav.icon }}</span>{{ @nav.label }}</a></check>
      <check if="{{ @nav.method == 'POST' }}"><form action="{{ @nav.href }}" method="post" data-nav-item="{{ @nav.key }}"><input type="hidden" name="csrf" value="{{ @nav.csrf }}"><button class="nav-link" type="submit"><span class="nav-icon">{{ @nav.icon }}</span>{{ @nav.label }}</button></form></check>
    </repeat>
  </nav>
  <check if="{{ @is_authenticated }}"><div class="sidebar-bottom"><div class="user-mini"><div class="avatar">CL</div><div><strong>{{ @user_email }}</strong><span>{{ @user_name ?: 'Signed in' }}</span></div></div></div></check>
</aside>
