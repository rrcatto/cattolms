<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ @title }} · {{ @app_name }}</title>
  <meta name="description" content="Structured self-study courses, progress tracking and assessments.">
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ @theme_css_url }}" rel="stylesheet">
  <check if="{{ @load_ckeditor }}"><link href="/css/ckeditor5.css" rel="stylesheet"></check>
</head>
<body data-palette="{{ @active_palette }}" class="{{ @body_class }} {{ @course_content_mode ? 'cl-course-page' : '' }}">
<check if="{{ @is_authenticated }}">
  <true>
    <div class="app-shell">
      <include href="partials/nav.html" />
      <main class="main">
        <header class="topbar" data-theme-breadcrumb>
          <div class="topbar-left">
            <button class="icon-btn mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation">☰</button>
            <div><div class="page-kicker">{{ @page_kicker }}</div><div class="page-title">{{ @page_title ?: @title }}</div></div>
          </div>
          <div class="top-actions">
            <check if="{{ @is_platform_admin }}"><button class="btn btn-soft" type="button" data-open-modal="quickActionModal">＋ Quick action</button></check>
            <details class="account-menu" data-nav-item="account"><summary class="btn btn-soft">Account ▾</summary><nav class="account-menu-panel" aria-label="Account navigation"><a href="/account/library">My Learning</a><a href="/account/profile">Profile</a><a href="/account/sessions">Active sessions</a></nav></details>
            <a class="icon-btn" href="/help" aria-label="Help">?</a>
          </div>
        </header>
        <div class="content">
          <include href="partials/flash.html" />
          {{ @page_content | raw }}
          <div class="footer-note">{{ @app_name }} · Learning platform</div>
        </div>
      </main>
    </div>
  </true>
  <false>
    <div class="public-shell">
      <nav class="public-nav" data-theme-nav><div class="public-nav-inner"><a class="brand" href="/" style="padding:0;color:var(--ink)"><span class="brand-mark">CL</span><span><strong>{{ @app_name }}</strong><small style="display:block;color:var(--muted)">Learning platform</small></span></a><div class="public-links"><a class="btn btn-ghost" href="/" data-nav-item="home">Home</a><a class="btn btn-ghost" href="/courses" data-nav-item="catalogue">Catalogue</a><a class="btn btn-primary" href="/login">Register or sign in</a></div></div></nav>
      <main class="public-main"><include href="partials/flash.html" />{{ @page_content | raw }}</main>
      <include href="partials/footer.html" />
    </div>
  </false>
</check>
<include href="partials/palette-switcher.html" />
<include href="partials/quick-actions.html" />
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="{{ @theme_js_url }}"></script>
<check if="{{ @load_ckeditor }}"><script src="/js/ckeditor5.umd.js"></script><script src="/js/ck-main.js"></script></check>
<check if="{{ @load_question_editor }}"><script src="/theme-assets/default/js/question-editor.js"></script></check>
<check if="{{ @load_assessment_timer }}"><script src="/theme-assets/default/js/assessment-timer.js"></script></check>
</body>
</html>
