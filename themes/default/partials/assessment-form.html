<form action="{{ @assessment_action }}" method="post" class="cl-assessment-form">
  <input type="hidden" name="csrf" value="{{ @csrf }}">
  <repeat group="{{ @assessment.questions }}" value="{{ @question }}" counter="{{ @question_number }}">
    <fieldset class="cl-question">
      <legend><span class="cl-question-number">{{ @question_number }}</span><span>{{ @question.question_html | raw }}</span><small>{{ @question.points }} point{{ @question.points == 1 ? '' : 's' }}</small></legend>
      <div class="cl-options">
        <repeat group="{{ @question.options }}" value="{{ @option }}">
          <label class="cl-option"><input type="radio" name="answer[{{ @question.id }}]" value="{{ @option.id }}" required><span>{{ @option.option_html | raw }}</span></label>
        </repeat>
      </div>
    </fieldset>
  </repeat>
  <div class="cl-assessment-submit"><button class="btn btn-primary btn-lg" type="submit">Submit assessment</button><span>All questions must be answered.</span></div>
</form>
