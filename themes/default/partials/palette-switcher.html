<check if="{{ @palette_selector_visible }}">
<div class="cl-palette-switcher" data-core-palette-switcher data-theme-slug="{{ @theme_name }}" data-server-palette="{{ @active_palette }}">
  <button class="cl-palette-reveal" type="button" data-palette-reveal aria-label="Show colour palette chooser">Colours</button>
  <section class="cl-palette-dock" data-palette-dock aria-label="Colour palette chooser">
    <div class="cl-palette-head"><div><strong>Colour palette</strong><span>Choose your preferred colours</span></div><button type="button" class="cl-palette-hide" data-palette-hide aria-label="Hide colour palette chooser">×</button></div>
    <div class="cl-palette-options">
      <repeat group="{{ @theme_palettes }}" key="{{ @paletteKey }}" value="{{ @palette }}">
        <button class="cl-palette-option {{ @active_palette==@paletteKey ? 'active' : '' }}" type="button" data-palette-choice="{{ @paletteKey }}" aria-pressed="{{ @active_palette==@paletteKey ? 'true' : 'false' }}">
          <span class="cl-palette-swatches"><repeat group="{{ @palette.colours }}" value="{{ @colour }}"><i style="background:{{ @colour }}"></i></repeat></span>
          <span>{{ @palette.name }}</span>
        </button>
      </repeat>
    </div>
  </section>
</div>
</check>
